<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Final - Despliegue Python</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 550px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p.desc {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: white;
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin: 0.2rem;
        }
        .team {
            margin-top: 1.5rem;
            text-align: left;
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
        }
        .team h3 {
            margin-top: 0;
            color: #e2e8f0;
            font-size: 1rem;
        }
        ul {
            margin: 0;
            padding-left: 1.2rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Servidor Ubuntu en Producción</h1>
        <p class="desc">Aplicación web desplegada exitosamente mediante Nginx y Gunicorn.</p>
        
        <div>
            <span class="badge">Python</span>
            <span class="badge">Flask</span>
            <span class="badge">Gunicorn</span>
            <span class="badge">Nginx</span>
            <span class="badge">GitHub Actions</span>
        </div>

        <div class="team">
            <h3>Integrantes del Equipo:</h3>
            <ul>
                <li>Juan</li>
            </ul>
        </div>
    </div>
</body>
</html>
